user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    gzip on;

    server {
        listen 80 default_server;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Proxy API, all health paths, and metrics directly to the backend K8s service.
        # No Cloudflare tunnel - internal cluster DNS, no SSL, no CF headers needed.
        #
        # AUTH.9 — defense-in-depth: strip incoming auth headers from any client.
        # In production, only oauth2-proxy (sitting in front of this nginx) is allowed
        # to set X-Forwarded-Email / X-Forwarded-User / X-Forwarded-Groups and the
        # accompanying X-Auth-Proxy-Signature/Timestamp pair. Without these explicit
        # `proxy_set_header X-* ""` lines, nginx forwards whatever a client sent —
        # which would let a LAN client that hits this Service directly (e.g. via the
        # frontend Service if it ever flips back to LoadBalancer) spoof headers.
        #
        # Setting a header to the empty string in nginx tells the upstream NOT to
        # receive that header from the client; oauth2-proxy can still set them on
        # its own outgoing requests because oauth2-proxy proxies into this nginx
        # (or directly into the backend) — but a raw client coming through this
        # nginx location gets its headers wiped.
        location ~ ^/(api|health|metrics) {
            proxy_pass http://mission-control-backend:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Strip auth headers from incoming clients (defense-in-depth)
            proxy_set_header X-Forwarded-Email "";
            proxy_set_header X-Forwarded-User "";
            proxy_set_header X-Forwarded-Groups "";
            proxy_set_header X-Auth-Proxy-Signature "";
            proxy_set_header X-Auth-Proxy-Timestamp "";

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 300;
            proxy_send_timeout 300;
        }

        # SPA routing - send all non-file requests to index.html
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Don't cache index.html (always fresh)
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # Cache static assets (JS, CSS, images)
        location ~ ^/(assets|images)/ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

    }
}
